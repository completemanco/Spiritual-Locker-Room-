<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Spiritual Locker Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0A0D12;
    --surface: #12161D;
    --surface-alt: #191F29;
    --ink: #F1EDE3;
    --ink-soft: #9AA1AC;
    --ink-faint: #656C78;
    --line: #232A36;
    --gold: #C7A05C;
    --gold-strong: #DDBD82;
    --gold-soft: rgba(199,160,92,0.12);
    --gold-ink: #16130B;
    --good: #5B9770;
    --good-soft: rgba(91,151,112,0.14);
    --danger: #C0665C;
    --danger-soft: rgba(192,102,92,0.14);
    --steel: #3A4451;
    --radius-s: 5px;
    --radius-m: 12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.display{font-family:'Archivo',sans-serif;letter-spacing:-0.01em;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea,select{font-family:inherit;font-size:15px;background:var(--surface-alt);color:var(--ink);border:1px solid var(--line);}
  input::placeholder,textarea::placeholder{color:var(--ink-faint);}

  #app{max-width:1080px;margin:0 auto;min-height:100vh;background:var(--bg);border-left:1px solid var(--line);border-right:1px solid var(--line);}

  header.top{position:sticky;top:0;z-index:20;background:rgba(10,13,18,0.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);}
  .top-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;}
  .brand{display:flex;align-items:center;gap:11px;}
  .brand-mark{width:34px;height:34px;border:1.5px solid var(--gold);border-radius:50%;flex:none;overflow:hidden;background:#000;}
  .brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand-name{font-family:'Archivo';font-weight:700;font-size:16px;color:var(--ink);}
  .brand-word{font-size:10.5px;color:var(--gold);font-weight:500;margin-top:-1px;letter-spacing:0.02em;}

  .role-pill{font-size:12px;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);display:flex;align-items:center;gap:8px;}
  .role-pill.leader{border-color:var(--gold);color:var(--gold);background:var(--gold-soft);}
  .role-pill button{background:none;border:none;color:inherit;font-size:12px;text-decoration:underline;padding:0;}
  .role-pill a{cursor:pointer;}

  .edit-toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--gold);}
  .switch{position:relative;width:34px;height:19px;background:var(--surface-alt);border:1px solid var(--line);border-radius:20px;flex:none;}
  .switch.on{background:var(--gold);}
  .switch .dot{position:absolute;top:1px;left:1px;width:15px;height:15px;background:var(--bg);border-radius:50%;transition:transform .15s;}
  .switch.on .dot{transform:translateX(15px);background:var(--gold-ink);}

  nav.tabs{display:flex;overflow-x:auto;gap:2px;padding:0 20px;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{background:none;border:none;padding:12px 12px;font-size:13.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap;border-bottom:2px solid transparent;}
  nav.tabs button.active{color:var(--gold-strong);border-bottom-color:var(--gold);font-weight:600;}

  main{padding:30px 20px 90px;}
  .view{display:none;}
  .view.active{display:block;animation:fade .25s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  section{margin-bottom:34px;}
  .eyebrow{font-size:11.5px;color:var(--gold);font-weight:600;margin:0 0 6px;letter-spacing:0.03em;text-transform:uppercase;}
  h2.section-title{font-size:21px;margin:0 0 4px;color:var(--ink);}
  .section-sub{color:var(--ink-soft);font-size:14px;margin:0 0 18px;max-width:520px;line-height:1.5;}

  /* ---------- home ---------- */
  .hero{padding:6px 0 4px;}
  .hero-banner{width:100%;border-radius:var(--radius-m);overflow:hidden;border:1px solid var(--line);margin-bottom:22px;}
  .hero-banner img{width:100%;display:block;}
  .focus-pill{display:inline-flex;align-items:center;gap:9px;background:var(--gold-soft);border:1px solid rgba(199,160,92,0.35);color:var(--gold-strong);font-size:12.5px;font-weight:600;padding:6px 14px 6px 8px;border-radius:20px;margin-bottom:18px;}
  .focus-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);}
  .jersey-num{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1.5px solid currentColor;font-family:'Archivo';font-weight:800;font-size:11.5px;flex:none;}
  .hero h1{font-size:32px;line-height:1.12;margin:0 0 14px;max-width:520px;color:var(--ink);}
  .hero h1[contenteditable="true"]{outline:1px dashed var(--gold);padding:4px 6px;border-radius:4px;}
  .hero p{color:var(--ink-soft);font-size:15px;line-height:1.65;max-width:480px;margin:0 0 24px;}
  .hero p[contenteditable="true"]{outline:1px dashed var(--gold);padding:4px 6px;border-radius:4px;}

  .cta-row{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{display:inline-block;padding:11px 18px;border-radius:var(--radius-s);font-size:13.5px;font-weight:600;border:1px solid var(--gold);background:var(--gold);color:var(--gold-ink);}
  .btn.secondary{background:none;color:var(--ink);border:1px solid var(--line);}
  .btn.ghost{background:none;color:var(--gold);border:none;text-decoration:underline;padding:6px 0;}
  .btn.danger{background:none;border:1px solid var(--danger);color:var(--danger);}
  .btn.small{padding:7px 13px;font-size:12.5px;}
  .btn.icon{padding:6px 9px;font-size:12px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}

  .quick-links{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:26px;}
  @media(max-width:640px){.quick-links{grid-template-columns:1fr;} .hero h1{font-size:26px;}}
  .qlink{border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;background:var(--surface);}
  .qlink .ql-eyebrow{font-size:11px;color:var(--gold);font-weight:600;margin-bottom:6px;text-transform:uppercase;letter-spacing:0.03em;}
  .qlink .ql-title{font-weight:600;font-size:14.5px;margin-bottom:4px;}
  .qlink .ql-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:10px;}

  .card{border:1px solid var(--line);border-radius:var(--radius-m);padding:18px;background:var(--surface);}
  .card + .card{margin-top:12px;}

  /* ---------- devotional ---------- */
  .devo-card{border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;background:var(--surface);}
  .devo-head{background:var(--surface-alt);border-bottom:1px solid var(--line);padding:20px;position:relative;}
  .devo-head .eyebrow2{font-size:11px;color:var(--gold);font-weight:600;margin:0 0 6px;letter-spacing:0.03em;text-transform:uppercase;}
  .devo-head h3{margin:0;font-size:21px;color:var(--ink);}
  .devo-body{padding:20px;}
  .verse{font-size:16px;font-style:italic;line-height:1.5;margin:0 0 6px;padding-left:14px;border-left:3px solid var(--gold);color:var(--ink);}
  .verse-ref{font-size:12.5px;color:var(--ink-faint);margin:0 0 16px;padding-left:17px;}
  .devo-body p.reflect{font-size:14.5px;line-height:1.7;color:var(--ink-soft);margin:0 0 14px;}
  .rep-box{background:var(--gold-soft);border-radius:var(--radius-s);padding:12px 14px;font-size:13.5px;color:var(--ink);}
  .rep-box b{color:var(--gold-strong);}

  /* ---------- journal ---------- */
  .subtabs{display:flex;gap:8px;margin-bottom:18px;}
  .subtabs button{padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--ink-soft);}
  .subtabs button.active{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:600;}

  .journal-prompt{margin-bottom:14px;}
  .journal-prompt label{display:block;font-size:13px;font-weight:600;color:var(--gold-strong);margin-bottom:6px;}
  .journal-prompt textarea{width:100%;border-radius:var(--radius-s);padding:10px 12px;resize:vertical;min-height:56px;font-size:14px;}

  .f-log-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .f-input{border:1px solid var(--line);border-radius:var(--radius-s);padding:14px;background:var(--surface);}
  .f-input .flabel{font-family:'Archivo';font-weight:700;font-size:13px;margin-bottom:8px;display:flex;align-items:center;gap:8px;color:var(--ink);}
  .f-input .flabel .dot{width:8px;height:8px;border-radius:50%;}
  .f-input textarea{width:100%;border-radius:var(--radius-s);padding:8px 10px;resize:vertical;min-height:44px;font-size:13.5px;}

  .log-entry{border:1px solid var(--line);border-radius:var(--radius-s);padding:14px;margin-bottom:10px;background:var(--surface);}
  .log-entry .date{font-size:11.5px;color:var(--gold);margin-bottom:8px;font-weight:600;}
  .log-entry .row{font-size:13.5px;margin-bottom:4px;color:var(--ink-soft);}
  .log-entry .row b{color:var(--ink);}
  .empty{color:var(--ink-faint);font-size:13.5px;padding:24px 0;text-align:center;border:1px dashed var(--line);border-radius:var(--radius-m);}

  /* ---------- community ---------- */
  .post{border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;margin-bottom:10px;background:var(--surface);}
  .post-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
  .post-name{font-weight:600;font-size:13.5px;color:var(--gold-strong);}
  .post-time{font-size:11.5px;color:var(--ink-faint);}
  .post-body{font-size:14px;line-height:1.55;color:var(--ink);}
  .post-actions{display:flex;gap:8px;margin-top:10px;align-items:center;}
  .pray-btn{border:1px solid var(--line);background:var(--surface-alt);border-radius:20px;padding:6px 12px;font-size:12.5px;color:var(--ink-soft);}
  .pray-btn.active{background:var(--good-soft);border-color:var(--good);color:var(--good);}

  .composer{display:flex;gap:8px;margin-bottom:20px;}
  .composer input{flex:1;border-radius:var(--radius-s);padding:10px 12px;font-size:14px;}

  /* ---------- media / calendar / courses ---------- */
  .media-card{border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;margin-bottom:14px;background:var(--surface);}
  .media-card iframe{width:100%;aspect-ratio:16/9;border:0;display:block;}
  .media-card .mc-body{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .media-card .mc-title{font-weight:600;font-size:14.5px;margin-bottom:2px;}
  .media-card .mc-meta{font-size:12px;color:var(--ink-faint);}
  .mc-actions{display:flex;gap:6px;flex:none;}

  .event-row{display:flex;gap:14px;border:1px solid var(--line);border-radius:var(--radius-m);padding:14px 16px;margin-bottom:10px;align-items:center;background:var(--surface);}
  .event-date{flex:none;width:52px;text-align:center;border-right:1px solid var(--line);padding-right:14px;}
  .event-date .d{font-family:'Archivo';font-weight:800;font-size:19px;color:var(--gold-strong);}
  .event-date .m{font-size:10.5px;color:var(--ink-faint);text-transform:uppercase;}
  .event-info{flex:1;}
  .event-info .et{font-weight:600;font-size:14.5px;}
  .event-info .em{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .event-row.past{opacity:.45;}
  .event-actions{display:flex;gap:6px;flex:none;align-items:center;}

  .course-card{border:1px solid var(--line);border-radius:var(--radius-m);overflow:hidden;margin-bottom:14px;background:var(--surface);}
  .course-card .cc-top{padding:16px;}
  .course-card h4{margin:0 0 6px;font-size:16px;}
  .course-card p{margin:0 0 10px;font-size:13.5px;color:var(--ink-soft);line-height:1.55;}
  .locked-banner{background:var(--gold-soft);color:var(--gold-strong);font-size:12.5px;padding:10px 16px;font-weight:600;border-radius:10px;margin-bottom:16px;}

  /* ---------- membership ---------- */
  .tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
  @media(max-width:720px){.tiers{grid-template-columns:1fr;}}
  .tier{border:1px solid var(--line);border-radius:var(--radius-m);padding:22px 18px;display:flex;flex-direction:column;background:var(--surface);position:relative;}
  .tier.featured{border:1.5px solid var(--gold);}
  .tier .tier-tag{position:absolute;top:-11px;left:18px;background:var(--gold);color:var(--gold-ink);font-size:10.5px;padding:3px 10px;border-radius:20px;font-weight:700;}
  .tier h3{font-size:16.5px;margin:6px 0 4px;}
  .tier .price{font-family:'Archivo';font-size:29px;font-weight:800;margin:6px 0;color:var(--gold-strong);}
  .tier .price span{font-size:12.5px;color:var(--ink-faint);font-weight:500;}
  .tier ul{list-style:none;padding:0;margin:14px 0 20px;flex:1;}
  .tier li{font-size:13.5px;color:var(--ink-soft);padding:6px 0;border-top:1px solid var(--line);}
  .tier li:first-child{border-top:none;}
  .tier-edit-btn{position:absolute;top:14px;right:14px;}

  .member-badge{display:inline-flex;align-items:center;gap:6px;background:var(--good-soft);color:var(--good);border-radius:20px;padding:6px 14px;font-size:12.5px;font-weight:600;}

  /* ---------- owner tools ---------- */
  .leader-tools{border:1px dashed var(--gold);border-radius:var(--radius-m);padding:16px;margin-bottom:20px;background:var(--gold-soft);}
  .leader-tools .lt-title{font-size:11.5px;font-weight:700;color:var(--gold-strong);margin-bottom:10px;letter-spacing:0.03em;text-transform:uppercase;}
  .leader-tools input, .leader-tools textarea{width:100%;border-radius:var(--radius-s);padding:9px 11px;font-size:13.5px;margin-bottom:8px;}
  .field-row{display:flex;gap:8px;}
  .field-row > *{flex:1;}
  .edit-pencil{background:var(--surface-alt);border:1px solid var(--line);color:var(--gold);border-radius:6px;padding:5px 8px;font-size:12px;}

  .modal-bg{position:fixed;inset:0;background:rgba(4,6,9,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);max-width:420px;width:100%;padding:24px;max-height:86vh;overflow:auto;}
  .modal h3{margin:0 0 10px;font-size:17px;color:var(--ink);}
  .modal p{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin:0 0 14px;}
  .modal input,.modal textarea{width:100%;border-radius:var(--radius-s);padding:9px 11px;font-size:13.5px;margin-bottom:10px;}
  .modal label{display:block;font-size:12px;color:var(--gold-strong);margin-bottom:4px;font-weight:600;}
  .modal .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}

  .note{font-size:12px;color:var(--ink-faint);margin-top:6px;line-height:1.5;}

  /* ---------- live call overlay ---------- */
  .call-overlay{position:fixed;inset:0;background:#000;display:none;z-index:70;flex-direction:column;}
  .call-overlay.open{display:flex;}
  .call-overlay .call-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line);flex:none;}
  .call-overlay .call-bar span{font-family:'Archivo';font-weight:700;color:var(--ink);font-size:14px;}
  .call-overlay iframe{flex:1;border:0;width:100%;height:100%;}
  .checkbox-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;}
  .checkbox-row input{width:auto;margin:0;}
</style>
</head>

/* ================= STORAGE HELPERS ================= */
// Shared data (community, videos, calendar, courses, pricing, etc.) lives in
// your real Postgres database via the backend. Personal data (your own
// journal entries, check-ins, and leader/member status) lives on this device.
function backendReady(){ return BACKEND_URL && !BACKEND_URL.includes('YOUR-BACKEND-URL'); }

/* ---------- Visitor tracking ---------- */
function getDeviceId(){
  let id = localStorage.getItem('slr_device_id');
  if(!id){ id = uid()+uid(); localStorage.setItem('slr_device_id', id); }
  return id;
}
async function trackVisit(){
  if(!backendReady()) return;
  try{
    await fetch(BACKEND_URL.replace(/\/$/,'') + '/api/track-visit', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ deviceId: getDeviceId() })
    });
  }catch(e){ /* silent — usage tracking should never block the app */ }
}
async function getVisitorStats(){
  if(!backendReady()) return null;
  try{
    const res = await fetch(BACKEND_URL.replace(/\/$/,'') + '/api/visitor-count');
    if(!res.ok) return null;
    return await res.json();
  }catch(e){ return null; }
}
async function getVal(key, shared){
  if(!shared){
    try{ const raw = localStorage.getItem('slr_'+key); return raw ? JSON.parse(raw) : null; }
    catch(e){ return null; }
  }
  if(!backendReady()) return null;
  try{
    const res = await fetch(BACKEND_URL.replace(/\/$/,'') + '/api/kv/' + encodeURIComponent(key));
    if(res.status === 404) return null;
    if(!res.ok) return null;
    const data = await res.json();
    return data.value;
  }catch(e){ return null; }
}
async function setVal(key, val, shared){
  if(!shared){
    try{ localStorage.setItem('slr_'+key, JSON.stringify(val)); }
    catch(e){ console.error("local save failed", e); }
    return;
  }
  if(!backendReady()){ console.error("backend not connected"); return; }
  try{
    await fetch(BACKEND_URL.replace(/\/$/,'') + '/api/kv/' + encodeURIComponent(key), {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ value: val })
    });
  }catch(e){ console.error("storage set failed", e); }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function fmtDate(ts){ return new Date(ts).toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'}); }
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if(s<60) return "just now";
  if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago";
  return Math.floor(s/86400)+"d ago";
}
function ytId(url){
  const m = url.match(/(?:youtu\.be\/|v=|embed\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : (url.length===11 ? url : null);
}
function escapeHtml(s){ const d = document.createElement('div'); d.innerText = s; return d.innerHTML; }
function todayFocus(){
  const start = new Date(new Date().getFullYear(),0,1);
  const dayOfYear = Math.floor((new Date()-start)/86400000);
  return FOCUS_ORDER[dayOfYear % 5];
}

function closeModal(){ document.getElementById('modalBg').classList.remove('open'); }

/* ---------- live video calls (Jitsi Meet — free, no account, no backend needed) ---------- */
async function createDailyRoom(name, expiryMinutes){
  // Builds a private-ish, unique room on Jitsi's free public server.
  // No signup, no card, no per-minute cost — good for groups up to a few dozen people per call.
  const base = (name || 'session').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40) || 'session';
  const unique = base + '-' + Math.random().toString(36).slice(2,8);
  return { url: 'https://meet.jit.si/' + unique, name: unique };
}
function openCall(url, title){
  document.getElementById('callTitle').textContent = title || 'Live Call';
  document.getElementById('callFrame').src = url;
  document.getElementById('callOverlay').classList.add('open');

  document.getElementById('callFrame').src = 'about:blank';
  document.getElementById('callOverlay').classList.remove('open');
}

async function saveHomeText(){
  const title = document.getElementById('homeTitle').innerText.trim();
  const sub = document.getElementById('homeSub').innerText.trim();
  await setVal('site_home', { title, sub }, true);
  renderHome();
}

/* ================= TODAY'S WORD ================= */
async function renderWord(){
  const focus = todayFocus();
  const overrides = (await getVal('devo_overrides', true)) || {};
  const d = Object.assign({}, DEFAULT_DEVOTIONALS[focus], overrides[focus]||{});
  const meta = F_META[focus];
  const el = document.getElementById('view-word');
  el.innerHTML = `
    <section>
      <p class="eyebrow">Daily devotional</p>
      <h2 class="section-title">This week's focus: ${meta.label}</h2>
      <p class="section-sub">Every day rotates through Faith, Family, Fitness, Finances, and Fun — so scripture and the five F's move together.</p>
      <div class="devo-card">
        <div class="devo-head" style="display:flex;align-items:center;gap:14px;">
          <span class="jersey-num" style="width:38px;height:38px;font-size:16px;border-color:${meta.color};color:${meta.color};">${meta.number}</span>
          <div>
            <p class="eyebrow2" style="margin-bottom:2px;">Today · ${meta.label}</p>
            <h3>${new Date().toLocaleDateString(undefined,{weekday:'long', month:'long', day:'numeric'})}</h3>
          </div>
          ${state.editMode ? `<button class="edit-pencil" style="position:absolute;top:16px;right:16px;" onclick="editDevotional('${focus}')">Edit</button>` : ``}
        </div>
        <div class="devo-body">
          <p class="verse">"${escapeHtml(d.verse)}"</p>
          <p class="verse-ref">${escapeHtml(d.ref)}</p>
          <p class="reflect">${escapeHtml(d.reflect)}</p>
          <div class="rep-box"><b>${escapeHtml(d.rep.split(':')[0])}:</b>${escapeHtml(d.rep.split(':').slice(1).join(':'))}</div>
        </div>
      </div>
    </section>
    <section>
      <p class="eyebrow">Daily reflection</p>
      <h2 class="section-title">Review your day</h2>
      <p class="section-sub">Private to you — a few honest sentences before you close it out.</p>
      <div id="dailyJournalBody"></div>
    </section>
  `;
  renderDailyJournal();
}
async function editDevotional(focus){
  const overrides = (await getVal('devo_overrides', true)) || {};
  const d = Object.assign({}, DEFAULT_DEVOTIONALS[focus], overrides[focus]||{});
  openModal(`
    <h3>Edit ${F_META[focus].label} devotional</h3>
    <label>Verse</label><textarea id="edVerse">${escapeHtml(d.verse)}</textarea>
    <label>Reference</label><input id="edRef" value="${escapeHtml(d.ref)}">
    <label>Reflection</label><textarea id="edReflect" style="min-height:100px;">${escapeHtml(d.reflect)}</textarea>
    <label>Today's rep</label><textarea id="edRep">${escapeHtml(d.rep)}</textarea>
    <div class="modal-actions">
      <button class="btn secondary small" onclick="closeModal()">Cancel</button>
      <button class="btn small" onclick="saveDevotional('${focus}')">Save</button>
    </div>
  `);
}
async function saveDevotional(focus){
  const overrides = (await getVal('devo_overrides', true)) || {};
  overrides[focus] = {
    verse: document.getElementById('edVerse').value.trim(),

async function postEvent(){
  const title = document.getElementById('evTitle').value.trim();
  const date = document.getElementById('evDate').value;
  const time = document.getElementById('evTime').value || '18:00';
  const eventType = document.getElementById('evType').value;
  if(!title || !date){ alert('Fill in a title and date.'); return; }
  const when = new Date(date+'T'+time).getTime();
  const events = (await getVal('events', true)) || [];

  if(eventType === 'in-person'){
    const location = document.getElementById('evLocation').value.trim();
    if(!location){ alert('Add a location for the in-person event.'); return; }
    events.push({ id:uid(), title, when, isInPerson:true, location });
    await setVal('events', events, true);
    renderCalendar();
    return;
  }

  let zoom = document.getElementById('evZoom').value.trim();
  const autoRoom = document.getElementById('evAutoRoom').checked;
  let isDaily = false;
  if(!zoom && autoRoom){
    const room = await createDailyRoom(title, null);
    if(!room) return;
    zoom = room.url; isDaily = true;
  }
  if(!zoom){ alert('Add a Zoom link, or check the box to auto-create a video room.'); return; }
  events.push({ id:uid(), title, when, zoom, isDaily });
  await setVal('events', events, true);
  renderCalendar();
}

function readFileAsDataUrl(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function postCourse(){
  const title = document.getElementById('crTitle').value.trim();
  const desc = document.getElementById('crDesc').value.trim();
  const url = document.getElementById('crUrl').value.trim();
  const fileInput = document.getElementById('crFile');
  const file = fileInput.files && fileInput.files[0];
  if(!title || !desc){ alert('Enter a title and description.'); return; }
  if(file && file.size > 8 * 1024 * 1024){ alert('That file is too large — please keep it under 8MB.'); return; }

  let fileData = null, fileName = null;
  if(file){
    try{
      fileData = await readFileAsDataUrl(file);
      fileName = file.name;
    }catch(e){
      alert('Could not read that file — try a different one.');
      return;
    }
  }

  const courses = (await getVal('courses', true)) || [];
  courses.unshift({ id:uid(), title, desc, ytid: url ? ytId(url) : null, fileData, fileName, time:Date.now() });
  await setVal('courses', courses, true);
  renderCourses();
}

  const tiers = (await getVal('membership_tiers', true)) || DEFAULT_TIERS;
  const myTier = await getVal('role_member_tier', false);
  el.innerHTML = `
    <section>
      <p class="eyebrow">Join</p>
      <h2 class="section-title">Membership</h2>
      <p class="section-sub">${state.isMember ? "You're a member — full access unlocked." : "Choose a plan to unlock courses and full access."}</p>
      ${state.isMember ? `<div class="member-badge" style="margin-bottom:20px;">✓ Active member${myTier ? ' — '+escapeHtml(myTier) : ''}</div>` : ``}
      <div class="tiers">
        ${tiers.map(t=>`
          <div class="tier ${t.tag?'featured':''}">
            ${t.tag ? `<div class="tier-tag">${escapeHtml(t.tag)}</div>` : ``}
            ${state.editMode ? `<button class="edit-pencil tier-edit-btn" onclick="editTier('${t.id}')">Edit</button>` : ``}
            <h3>${escapeHtml(t.name)}</h3>
            <div class="price">$${t.price}<span>${periodLabel(t)}</span></div>
            <ul>${t.features.map(f=>`<li>${f}</li>`).join('')}</ul>
            <button class="btn ${t.tag?'':'secondary'}" onclick="startCheckout('${t.id}')" ${state.isMember?'disabled':''}>${state.isMember?'Included':'Choose plan'}</button>
          </div>
        `).join('')}
      </div>
      ${state.editMode ? `<button class="btn secondary small" style="margin-top:16px;" onclick="addTier()">+ Add plan</button>` : ``}
      ${!stripeReady() ? `<p class="note" style="margin-top:16px;">Payments aren't connected yet — see the backend README for Stripe setup.</p>` : ``}
      ${state.isMember ? `<p class="note" style="margin-top:16px;"><button onclick="cancelMembership()" style="background:none;border:none;color:var(--ink-faint);text-decoration:underline;font-size:12px;padding:0;cursor:pointer;">Remove membership from this device</button></p>` : ``}
    </section>

    ${!state.isMember ? `
    <section>
      <p class="eyebrow">Already have access?</p>
      <h2 class="section-title">Unlock on this device</h2>
      <p class="section-sub">Already paid, or your coach gave you access another way? Enter the email you used and we'll unlock it here.</p>
      <div class="composer">
        <input id="claimEmail" type="email" placeholder="you@email.com" onkeydown="if(event.key==='Enter')claimAccess()">
      </div>
      <button class="btn small" onclick="claimAccess()">Unlock access</button>
      <span id="claimMsg" style="margin-left:10px;font-size:13px;font-weight:600;"></span>
    </section>
    ` : ``}

    ${state.isLeader && state.editMode ? `<div id="membersPanel"></div>` : ``}
  `;
  if(state.isLeader && state.editMode) renderMembersPanel();
}

/* ---------- Member directory (Coach-managed) ---------- */
async function getMembers(){ return (await getVal('members', true)) || []; }
async function renderMembersPanel(){
  const panel = document.getElementById('membersPanel');
  if(!panel) return;
  const tiers = (await getVal('membership_tiers', true)) || DEFAULT_TIERS;
  const members = await getMembers();
  const paidCount = members.filter(m=>m.status==='paid').length;
  const grantedCount = members.filter(m=>m.status!=='paid').length;
  const stats = await getVisitorStats();
  panel.innerHTML = `
    <section>
      <p class="eyebrow">Coach tools</p>
      <h2 class="section-title">Members</h2>
      <p class="section-sub">Everyone with access — who paid through Stripe, and anyone you've granted access manually.</p>
      <div class="grid-2" style="margin-bottom:18px;">
        <div class="card"><div style="font-size:12px;color:var(--ink-faint);margin-bottom:4px;">People who've opened the app</div><div style="font-family:'Archivo';font-weight:800;font-size:26px;">${stats ? stats.total : '—'}</div>${stats ? `<div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${stats.active30} active in the last 30 days</div>` : `<div class="note">Connect the backend to see this.</div>`}</div>
        <div class="card"><div style="font-size:12px;color:var(--ink-faint);margin-bottom:4px;">Members</div><div style="font-family:'Archivo';font-weight:800;font-size:26px;">${members.length}</div><div style="font-size:12px;color:var(--ink-soft);margin-top:2px;">${paidCount} paid · ${grantedCount} granted</div></div>
      </div>
      <button class="btn small" style="margin-bottom:14px;" onclick="openAddMemberModal()">+ Add member</button>
      ${members.length===0 ? `<div class="empty">No members yet.</div>` :
        members.map(m=>`
          <div class="post">
            <div class="post-head">
              <span class="post-name">${escapeHtml(m.name || m.email || 'Unnamed')}</span>
              <span class="post-time">${m.status==='paid' ? '✓ Paid' : 'Granted'}${m.source==='stripe' ? ' · Stripe' : ' · Manual'}</span>
            </div>
            <div class="post-body">${m.email ? escapeHtml(m.email)+' · ' : ''}${escapeHtml(m.tier || 'No tier set')}</div>
            <div class="post-actions">
              <button class="btn secondary small" onclick="openEditMemberModal('${m.id}')">Edit</button>
              <button class="btn danger small" onclick="deleteMember('${m.id}')">Remove</button>
            </div>
          </div>
        `).join('')}
    </section>
  `;
}
function memberTierOptions(selectedTier, tiers){
  return tiers.map(t=>`<option value="${escapeHtml(t.name)}" ${selectedTier===t.name?'selected':''}>${escapeHtml(t.name)}</option>`).join('');
}
async function openAddMemberModal(){
  const tiers = (await getVal('membership_tiers', true)) || DEFAULT_TIERS;
  openModal(`
    <h3>Add a member</h3>
    <p>Grant access manually — for cash, Venmo, a scholarship spot, whatever doesn't run through Stripe.</p>
    <label>Name</label><input id="mName" placeholder="Full name">
    <label>Email (lets them unlock it themselves on their device)</label><input id="mEmail" type="email" placeholder="you@email.com">
    <label>Tier</label>
    <select id="mTier" style="width:100%;padding:9px 11px;border-radius:6px;margin-bottom:10px;border:1px solid var(--line);background:var(--surface-alt);color:var(--ink);">
      ${memberTierOptions(tiers[0] ? tiers[0].name : '', tiers)}
    </select>
    <div class="modal-actions">
      <button class="btn secondary small" onclick="closeModal()">Cancel</button>
      <button class="btn small" onclick="saveNewMember()">Add member</button>
    </div>
  `);
}
async function saveNewMember(){
  const name = document.getElementById('mName').value.trim();
  const email = document.getElementById('mEmail').value.trim().toLowerCase();
  const tier = document.getElementById('mTier').value;
  if(!name && !email){ alert('Add at least a name or email.'); return; }
  const members = await getMembers();
  members.push({ id:uid(), name, email, tier, status:'granted', source:'manual', addedAt:Date.now() });
  await setVal('members', members, true);
  closeModal(); renderMembersPanel();
}
async function openEditMemberModal(id){
  const members = await getMembers();
  const m = members.find(x=>x.id===id);
  if(!m) return;
  const tiers = (await getVal('membership_tiers', true)) || DEFAULT_TIERS;
  openModal(`
    <h3>Edit member</h3>
    <label>Name</label><input id="mName" value="${escapeHtml(m.name||'')}">
    <label>Email</label><input id="mEmail" type="email" value="${escapeHtml(m.email||'')}">
    <label>Tier</label>
    <select id="mTier" style="width:100%;padding:9px 11px;border-radius:6px;margin-bottom:10px;border:1px solid var(--line);background:var(--surface-alt);color:var(--ink);">
      ${memberTierOptions(m.tier, tiers)}
    </select>
    <div class="modal-actions">
      <button class="btn secondary small" onclick="closeModal()">Cancel</button>
      <button class="btn small" onclick="saveEditedMember('${id}')">Save</button>
    </div>
  `);
}
async function saveEditedMember(id){
  const members = await getMembers();
  const m = members.find(x=>x.id===id);
  if(!m) return;
  m.name = document.getElementById('mName').value.trim();
  m.email = document.getElementById('mEmail').value.trim().toLowerCase();
  m.tier = document.getElementById('mTier').value;
  await setVal('members', members, true);
  closeModal(); renderMembersPanel();
}
async function deleteMember(id){
  const members = await getMembers();
  await setVal('members', members.filter(m=>m.id!==id), true);
  renderMembersPanel();
}
async function claimAccess(){
  const emailInput = document.getElementById('claimEmail');
  const msg = document.getElementById('claimMsg');
  const email = emailInput.value.trim().toLowerCase();
  if(!email){ return; }
  const members = await getMembers();
  const match = members.find(m => (m.email||'').toLowerCase() === email && (m.status==='paid' || m.status==='granted'));
  if(match){
    await setVal('role_member', true, false);
    await setVal('role_member_tier', match.tier || '', false);
    state.isMember = true;
    msg.style.color = 'var(--good)';
    msg.textContent = '✓ Unlocked';
    setTimeout(()=>{ renderMembership(); renderCourses(); }, 700);
  } else {
    msg.style.color = 'var(--danger)';
    msg.textContent = 'No access found for that email — check with your coach.';
  }
}
async function editTier(id){
  const tiers = (await getVal('membership_tiers', true)) || DEFAULT_TIERS;
  const t = tiers.find(x=>x.id===id);
  if(!t) return;
  openModal(`
    <h3>Edit plan</h3>
    <label>Plan name</label><input id="tName" value="${escapeHtml(t.name)}">
    <label>Billing</label>
    <select id="tBillingType" style="width:100%;padding:9px 11px;border-radius:6px;margin-bottom:10px;border:1px solid var(--line);background:var(--surface-alt);color:var(--ink);">
      <option value="recurring" ${t.billingType!=='one_time'?'selected':''}>Monthly (recurring)</option>
      <option value="one_time" ${t.billingType==='one_time'?'selected':''}>One-time payment</option>
    </select>
    <label>Price ($)</label><input id="tPrice" type="number" value="${t.price}">
    <label>One-time label (only used for one-time plans, e.g. "one-time · 12 weeks")</label>
    <input id="tPeriodLabel" value="${escapeHtml(t.periodLabel || 'one-time')}">
    <label>Badge (leave blank for none, e.g. "Most complete")</label><input id="tTag" value="${escapeHtml(t.tag||'')}">
    <label>Features (one per line)</label><textarea id="tFeatures" style="min-height:90px;">${t.features.join('\\n')}</textarea>
    <div class="modal-actions">
      <button class="btn danger small" onclick="removeTier('${id}')">Delete plan</button>
      <button class="btn secondary small" onclick="closeModal()">Cancel</button>
      <button class="btn small" onclick="saveTier('${id}')">Save</button>
    </div>
  `);
}
async function saveTier(id){
  const tiers = (await getVal('membership_tiers', true)) || DEFAULT_TIERS;
  const t = tiers.find(x=>x.id===id);
  if(!t) return;
  t.name = document.getElementById('tName').value.trim() || t.name;
  t.billingType = document.getElementById('tBillingType').value;
  t.price = parseFloat(document.getElementById('tPrice').value) || 0;
  t.periodLabel = document.getElementById('tPeriodLabel').value.trim() || 'one-time';
  t.tag = document.getElementById('tTag').value.trim();
  t.features = document.getElementById('tFeatures').value.split('\\n').map(s=>s.trim()).filter(Boolean);
  await setVal('membership_tiers', tiers, true);
  closeModal(); renderMembership();
}
async function removeTier(id){
  const tiers = (await getVal('membership_tiers', true)) || DEFAULT_TIERS;
  await setVal('membership_tiers', tiers.filter(t=>t.id!==id), true);
  closeModal(); renderMembership();
}
async function addTier(){
  const tiers = (await getVal('membership_tiers', true)) || DEFAULT_TIERS;
  tiers.push({ id:uid(), name:'New Plan', price:0, billingType:'recurring', tag:'', features:['Feature one','Feature two'] });
  await setVal('membership_tiers', tiers, true);
  renderMembership();
}

/* ---------- Real Stripe checkout ---------- */
async function startCheckout(tierId){
  const tiers = (await getVal('membership_tiers', true)) || DEFAULT_TIERS;
  const t = tiers.find(x=>x.id===tierId);
  if(!t) return;
  if(!stripeReady()){
    alert("Payments aren't connected yet. Add your Stripe secret key to the backend — see the README.");
    return;
  }
  const baseUrl = window.location.origin + window.location.pathname;
  try{
    const res = await fetch(BACKEND_URL.replace(/\/$/,'') + '/api/create-checkout-session', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        tierName: t.name,
        price: t.price,
        billingType: t.billingType === 'one_time' ? 'one_time' : 'recurring',
        successUrl: baseUrl + '?membership=success&session_id={CHECKOUT_SESSION_ID}&tier=' + encodeURIComponent(t.name),
        cancelUrl: baseUrl + '?membership=cancelled'
      })
    });
    const data = await res.json();
    if(!res.ok || !data.url){ alert('Could not start checkout: ' + (data.error || res.status)); return; }
    window.location.href = data.url;
  }catch(e){
    alert("Could not reach the payment backend. Check that it's running.");
  }
}
async function checkForReturningPayment(){
  const params = new URLSearchParams(window.location.search);
  const sessionId = params.get('session_id');
  const membershipParam = params.get('membership');
  const tierName = params.get('tier');
  if(membershipParam === 'cancelled'){
    window.history.replaceState({}, '', window.location.pathname);
    return;
  }
  if(membershipParam === 'success' && sessionId){
    try{
      const res = await fetch(BACKEND_URL.replace(/\/$/,'') + '/api/verify-session?session_id=' + encodeURIComponent(sessionId));
      const data = await res.json();
      if(data.paid){
        await setVal('role_member', true, false);
        await setVal('role_member_tier', tierName || '', false);
        state.isMember = true;
        // Record the payer in the shared member directory so the Coach can see who's paid.
        const email = (data.email || '').trim().toLowerCase();
        const members = (await getVal('members', true)) || [];
        const existing = email ? members.find(m => (m.email||'').toLowerCase() === email) : null;
        if(existing){
          existing.status = 'paid'; existing.tier = tierName || existing.tier; existing.source = 'stripe';
          if(data.name) existing.name = data.name;
        } else {
          members.push({ id:uid(), name:data.name||'', email, tier:tierName||'', status:'paid', source:'stripe', addedAt:Date.now() });
        }
        await setVal('members', members, true);
      }
    }catch(e){ console.error('payment verification failed', e); }
    window.history.replaceState({}, '', window.location.pathname);
  }
}
async function cancelMembership(){
  await setVal('role_member', false, false);
  await setVal('role_member_tier', '', false);
  state.isMember = false;
  renderMembership();
  renderCourses();
}

/* ================= INIT ================= */
function renderAll(){
  renderHome();
  renderWord();
  renderJournal();
  renderCommunity();
  renderVideos();
  renderCalendar();
  renderCourses();
  renderMembership();
}
(async function init(){
  await initRole();
  const cameFromCheckout = !!new URLSearchParams(window.location.search).get('membership');
  await checkForReturningPayment();
  if(cameFromCheckout) state.tab = 'membership';
  renderTabs();
  renderAll();
  showView(state.tab);
  trackVisit(); // fire-and-forget, never blocks the app
})();
</script>
